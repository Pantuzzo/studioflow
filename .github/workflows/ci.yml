name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Bundle budget
        run: pnpm -F @studioflow/web size

      - name: Build Storybook
        run: pnpm build-storybook

  # Six browser tests, kept in their own job for the same reason as the API's:
  # a browser download should not hold up a type error.
  #
  # They run against a production build with the mock layer compiled in, not the
  # dev server, so what CI exercises is the artefact that would ship. What is in
  # here and what deliberately is not is written down in apps/web/e2e/README.md.
  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chromium only. The suite tests behaviour the unit tests cannot reach —
      # real layout, real focus, real print media — not engine differences.
      - name: Install Chromium
        run: pnpm -F @studioflow/web exec playwright install --with-deps chromium

      - name: Web e2e
        run: pnpm -F @studioflow/web test:e2e

      # Retries are off, so a failure here is a real one and the trace is the
      # only record of it.
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # The API's e2e suite talks to a real Postgres — mocking the database would
  # only prove the mock. Kept in its own job so the fast checks above are not
  # held up by a container boot.
  api-e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: studioflow
          POSTGRES_PASSWORD: studioflow
          POSTGRES_DB: studioflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studioflow -d studioflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://studioflow:studioflow@localhost:5432/studioflow?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm -F @studioflow/api db:deploy

      - name: API e2e
        run: pnpm -F @studioflow/api test:e2e
