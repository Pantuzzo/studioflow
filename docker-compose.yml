services:
  postgres:
    image: postgres:17-alpine
    container_name: studioflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: studioflow
      POSTGRES_PASSWORD: studioflow
      POSTGRES_DB: studioflow
    ports:
      - '5432:5432'
    volumes:
      - studioflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U studioflow -d studioflow']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  studioflow-pgdata:
